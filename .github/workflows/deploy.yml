name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with "GitHub Actions" as the source) so you don't
          # have to toggle it manually in Settings → Pages.
          enablement: true

      - name: Generate static site
        # configure-pages exposes the correct base_path for user/org or
        # project pages (e.g. "/<repo>"); Nuxt reads it via NUXT_APP_BASE_URL.
        # Set a repository variable SITE_URL to control canonical/OG/sitemap URLs.
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://www.acteamo.com' }}
        run: npm run generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
