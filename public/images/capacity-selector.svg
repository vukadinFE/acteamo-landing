<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Acteamo capacity selector">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1edfb"/>
      <stop offset="0.7" stop-color="#fafbfc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g transform="translate(300 150)">
    <rect width="600" height="330" rx="28" fill="#ffffff" stroke="#e4e9ef"/>
    <text x="40" y="70" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#566072" letter-spacing="1.5">TODAY</text>
    <text x="40" y="110" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#0b1220">How much capacity today?</text>
    <g transform="translate(40 150)">
      <rect width="520" height="56" rx="16" fill="#eff4f9"/>
      <rect x="268" y="6" width="120" height="44" rx="12" fill="#ffffff" stroke="#e4e9ef"/>
      <text x="70" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#566072" text-anchor="middle">Drained</text>
      <text x="195" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#566072" text-anchor="middle">Low</text>
      <text x="328" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0b1220" text-anchor="middle">Good</text>
      <text x="455" y="36" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#566072" text-anchor="middle">Charged</text>
    </g>
    <g transform="translate(40 240)">
      <rect width="520" height="8" rx="4" fill="#ebebe7"/>
      <rect width="364" height="8" rx="4" fill="#0867cc"/>
      <text x="0" y="40" font-family="Inter, sans-serif" font-size="15" fill="#566072">Fits your capacity · 4 tasks</text>
    </g>
  </g>
</svg>
